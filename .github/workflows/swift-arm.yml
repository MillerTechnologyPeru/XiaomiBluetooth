name: Swift ARM
on: [push]
jobs:

  linux-armv7-crosscompile-build:
    name: Crosscompile for Linux Armv7
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The cross-compilation SDK must match the compiler version exactly.
        swift: ["6.4.0"]
        linux: ["debian"]
        release: ["bookworm"]
        arch: ["armv7"]
    container: swift:${{ matrix.swift }}
    env:
      SDK: swift-${{ matrix.swift }}-RELEASE-${{ matrix.linux }}-${{ matrix.release }}-${{ matrix.arch }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install dependencies
      run: apt update -y; apt install wget -y
    - name: Install SDK
      run: |
        wget --no-verbose https://github.com/xtremekforever/swift-armv7/releases/download/${{ matrix.swift }}/$SDK-sdk.tar.gz
        tar -xf $SDK-sdk.tar.gz
        mv $SDK /opt/$SDK
    - name: Swift Version
      run: swift --version
    - name: Build (Release)
      run: swift build -c release --destination /opt/$SDK/${{ matrix.linux }}-${{ matrix.release }}.json
    - name: Build Tests
      run: swift build --build-tests --destination /opt/$SDK/${{ matrix.linux }}-${{ matrix.release }}.json
    - name: Archive Build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-armv7-crosscompile-test
        path: .build/*/debug/*.xctest
